<!DOCTYPE html>
<html lang="km" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Sales & Invoice Mini App</title>
    <!-- Tailwind CSS Script -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        telegram: {
                            blue: '#2481cc',
                            dark: '#0f172a',
                            card: '#1e293b',
                            gold: '#fbbf24',
                            accent: '#8b5cf6'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Poppins & Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .glass-premium {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.15);
        }
        .gold-gradient {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #fbbf24 100%);
        }
        .premium-bg {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a 60%, #020617 100%);
        }
    </style>
</head>
<body class="premium-bg text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 selection:bg-amber-500 selection:text-white">

    <header class="w-full max-w-xl mx-auto mb-6">
        <div class="glass-premium rounded-2xl p-4 shadow-2xl flex items-center justify-between border-t border-amber-500/30">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-full gold-gradient p-0.5 flex items-center justify-center shadow-lg shadow-amber-500/20">
                    <img id="userAvatar" src="https://placehold.co/100x100/1e293b/fbbf24?text=TG" alt="User Avatar" class="w-full h-full rounded-full object-cover">
                </div>
                <div>
                    <div class="flex items-center space-x-1.5">
                        <span id="userName" class="font-bold text-base sm:text-lg tracking-wide text-amber-300">Telegram User</span>
                        <i class="fa-solid fa-circle-check text-blue-400 text-xs" title="Verified Telegram Account"></i>
                    </div>
                    <p class="text-xs text-slate-400 flex items-center gap-1">
                        <i class="fa-brands fa-telegram text-blue-400"></i> Connected via Telegram WebApp
                    </p>
                </div>
            </div>
            <div class="text-right">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/30">
                    <i class="fa-solid fa-crown text-amber-400 mr-1.5"></i> Premium VIP
                </span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-xl mx-auto flex-grow mb-8">
        <div class="flex rounded-xl bg-slate-900/80 p-1.5 mb-6 border border-slate-800 shadow-inner">
            <button onclick="switchTab('input')" id="tabInput" class="flex-1 py-3 px-4 rounded-lg font-medium text-sm transition-all duration-300 flex items-center justify-center space-x-2 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold shadow-md">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>Type 1: បញ្ចូលទំនិញ</span>
            </button>
            <button onclick="switchTab('invoice')" id="tabInvoice" class="flex-1 py-3 px-4 rounded-lg font-medium text-sm transition-all duration-300 flex items-center justify-center space-x-2 text-slate-400 hover:text-slate-200">
                <i class="fa-solid fa-file-invoice-dollar"></i>
                <span>Type 2: វិក័យបត្រ</span>
            </button>
        </div>

        <div id="sectionInput" class="space-y-6">
            <div class="glass-premium rounded-2xl p-5 shadow-xl">
                <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-700/50">
                    <h2 class="text-lg font-semibold text-amber-300 flex items-center gap-2">
                        <i class="fa-solid fa-boxes-stacked"></i> បញ្ជីមុខទំនិញ
                    </h2>
                    <button onclick="addItem()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3.5 py-1.5 rounded-xl font-semibold text-xs transition shadow-lg shadow-amber-500/20 flex items-center gap-1.5 active:scale-95">
                        <i class="fa-solid fa-plus"></i> បន្ថែមទំនិញ
                    </button>
                </div>

                <!-- Items Container -->
                <div id="itemsContainer" class="space-y-4 max-h-[400px] overflow-y-auto pr-1">
                    <!-- Dynamic rows will be inserted here -->
                </div>
            </div>

            <!-- Grand Total Card -->
            <div class="glass-premium rounded-2xl p-5 shadow-xl border-l-4 border-l-amber-500 flex items-center justify-between bg-gradient-to-r from-slate-900/90 to-slate-800/80">
                <div>
                    <span class="text-xs uppercase tracking-wider text-slate-400 font-medium">សរុបទឹកប្រាក់សរុប (Grand Total)</span>
                    <p class="text-xs text-amber-300/80 mt-0.5">គណនា៖ (តម្លៃពេញ - តម្លៃនេត) × ចំនួន</p>
                </div>
                <div class="text-right">
                    <span id="grandTotalDisplay" class="text-2xl sm:text-3xl font-extrabold text-amber-400">0.00 $</span>
                </div>
            </div>
        </div>

        <div id="sectionInvoice" class="hidden space-y-6">
            <div class="glass-premium rounded-2xl p-6 shadow-2xl relative overflow-hidden border border-amber-500/20">
                <div class="absolute top-0 right-0 w-32 h-32 bg-amber-500/5 rounded-full blur-2xl pointer-events-none"></div>
                
                <div class="text-center pb-6 border-b border-slate-700/60 mb-6">
                    <span class="inline-block p-3 rounded-2xl bg-amber-500/10 text-amber-400 mb-2 border border-amber-500/20">
                        <i class="fa-solid fa-receipt text-2xl"></i>
                    </span>
                    <h2 class="text-xl font-bold tracking-wide text-white">វិក័យបត្រពិនិត្យទំនិញ</h2>
                    <p class="text-xs text-slate-400 mt-1" id="invoiceDate">កាលបរិច្ឆេទ៖ -</p>
                </div>

                <div class="mb-6 bg-slate-900/60 p-3.5 rounded-xl border border-slate-800 flex justify-between items-center text-sm">
                    <span class="text-slate-400">អ្នកលក់ / គណនី៖</span>
                    <span id="invoiceUser" class="font-semibold text-amber-300">Telegram User</span>
                </div>

                <!-- Invoice Table (Excluding Final Calculated Result as Requested) -->
                <div class="overflow-x-auto rounded-xl border border-slate-700/50 mb-6">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-800/80 text-slate-300 text-xs uppercase tracking-wider">
                                <th class="p-3">ល.រ</th>
                                <th class="p-3">ឈ្មោះទំនិញ</th>
                                <th class="p-3 text-right">តម្លៃពេញ</th>
                                <th class="p-3 text-right">ចំនួន</th>
                            </tr>
                        </thead>
                        <tbody id="invoiceTableBody" class="divide-y divide-slate-800 text-sm">
                            <!-- Rows injected dynamically -->
                        </tbody>
                    </table>
                </div>

                <!-- Share to Telegram Button -->
                <button onclick="shareToTelegram()" class="w-full py-3.5 px-4 rounded-xl gold-gradient text-slate-950 font-bold shadow-xl shadow-amber-500/20 hover:opacity-95 transition flex items-center justify-center space-x-2 active:scale-95">
                    <i class="fa-brands fa-telegram text-lg"></i>
                    <span>ចែករំលែករបាយការណ៍មក Telegram</span>
                </button>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-xl mx-auto text-center text-xs text-slate-500 pb-2">
        <p>Telegram Premium Mini App &bull; Secure & Fast</p>
    </footer>

    <script>
        // State Management for Items
        let items = [
            { name: 'ទំនិញគំរូទី ១', fullPrice: 15, netPrice: 5, quantity: 2 },
            { name: 'ទំនិញគំរូទី ២', fullPrice: 25, netPrice: 10, quantity: 1 }
        ];

        // Initialize Telegram WebApp or Fallback to Profile
        window.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram?.WebApp;
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim() || user.username || 'Telegram User';
                document.getElementById('userName').innerText = fullName;
                document.getElementById('invoiceUser').innerText = fullName;
                if (user.photo_url) {
                    document.getElementById('userAvatar').src = user.photo_url;
                }
            } else {
                // Simulated Telegram Premium User fallback
                const simName = 'Samean Pro (VIP)';
                document.getElementById('userName').innerText = simName;
                document.getElementById('invoiceUser').innerText = simName;
            }

            // Set current date
            const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            document.getElementById('invoiceDate').innerText = 'កាលបរិច្ឆេទ៖ ' + new Date().toLocaleDateString('km-KH', options);

            renderItems();
        });

        // Switch between Type 1 and Type 2
        function switchTab(tab) {
            const tabInput = document.getElementById('tabInput');
            const tabInvoice = document.getElementById('tabInvoice');
            const sectionInput = document.getElementById('sectionInput');
            const sectionInvoice = document.getElementById('sectionInvoice');

            if (tab === 'input') {
                tabInput.className = "flex-1 py-3 px-4 rounded-lg font-medium text-sm transition-all duration-300 flex items-center justify-center space-x-2 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold shadow-md";
                tabInvoice.className = "flex-1 py-3 px-4 rounded-lg font-medium text-sm transition-all duration-300 flex items-center justify-center space-x-2 text-slate-400 hover:text-slate-200";
                sectionInput.classList.remove('hidden');
                sectionInvoice.classList.add('hidden');
            } else {
                tabInvoice.className = "flex-1 py-3 px-4 rounded-lg font-medium text-sm transition-all duration-300 flex items-center justify-center space-x-2 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold shadow-md";
                tabInput.className = "flex-1 py-3 px-4 rounded-lg font-medium text-sm transition-all duration-300 flex items-center justify-center space-x-2 text-slate-400 hover:text-slate-200";
                sectionInvoice.classList.remove('hidden');
                sectionInput.classList.add('hidden');
                renderInvoice();
            }
        }

        // Render Input Rows
        function renderItems() {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';

            items.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = "p-4 rounded-xl bg-slate-900/60 border border-slate-800 space-y-3 relative group transition hover:border-amber-500/40";
                row.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">មុខទំនិញទី #${index + 1}</span>
                        ${items.length > 1 ? `<button onclick="removeItem(${index})" class="text-slate-400 hover:text-red-400 transition text-sm p-1"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">ឈ្មោះទំនិញ</label>
                        <input type="text" value="${item.name}" oninput="updateItem(${index}, 'name', this.value)" placeholder="បញ្ចូលឈ្មោះទំនិញ..." class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition">
                    </div>
                    <div class="grid grid-cols-3 gap-2.5">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">តម្លៃពេញ ($)</label>
                            <input type="number" step="any" value="${item.fullPrice}" oninput="updateItem(${index}, 'fullPrice', this.value)" class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">តម្លៃនេត ($)</label>
                            <input type="number" step="any" value="${item.netPrice}" oninput="updateItem(${index}, 'netPrice', this.value)" class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">ចំនួន</label>
                            <input type="number" step="any" value="${item.quantity}" oninput="updateItem(${index}, 'quantity', this.value)" class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition">
                        </div>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-slate-800 text-xs">
                        <span class="text-slate-400">តម្លៃសរុបតាមជួរ៖</span>
                        <span class="font-bold text-amber-300" id="subtotal-${index}">${calculateSubtotal(item).toFixed(2)} $</span>
                    </div>
                `;
                container.appendChild(row);
            });

            calculateGrandTotal();
        }

        // Add new item
        function addItem() {
            items.push({ name: '', fullPrice: 0, netPrice: 0, quantity: 1 });
            renderItems();
        }

        // Remove item
        function removeItem(index) {
            items.splice(index, 1);
            renderItems();
        }

        // Update item property
        function updateItem(index, field, value) {
            if (field === 'name') {
                items[index][field] = value;
            } else {
                items[index][field] = parseFloat(value) || 0;
            }
            const subtotalEl = document.getElementById(`subtotal-${index}`);
            if (subtotalEl) {
                subtotalEl.innerText = calculateSubtotal(items[index]).toFixed(2) + ' $';
            }
            calculateGrandTotal();
        }

        // Formula: (Full Price - Net Price) * Quantity
        function calculateSubtotal(item) {
            const fp = parseFloat(item.fullPrice) || 0;
            const np = parseFloat(item.netPrice) || 0;
            const qty = parseFloat(item.quantity) || 0;
            return (fp - np) * qty;
        }

        // Grand Total Calculation
        function calculateGrandTotal() {
            let total = 0;
            items.forEach(item => {
                total += calculateSubtotal(item);
            });
            document.getElementById('grandTotalDisplay').innerText = total.toFixed(2) + ' $';
        }

        // Render Invoice Preview (Without total result as requested)
        function renderInvoice() {
            const tbody = document.getElementById('invoiceTableBody');
            tbody.innerHTML = '';

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-500">គ្មានទំនិញក្នុងបញ្ជី</td></tr>`;
                return;
            }

            items.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/40 transition";
                tr.innerHTML = `
                    <td class="p-3 text-slate-400 font-medium">${index + 1}</td>
                    <td class="p-3 font-medium text-slate-200">${item.name || '(គ្មានឈ្មោះ)'}</td>
                    <td class="p-3 text-right text-slate-300">${parseFloat(item.fullPrice || 0).toFixed(2)} $</td>
                    <td class="p-3 text-right text-slate-300">${item.quantity || 0}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Share to Telegram format (Item Name, Full Price, Quantity - No results)
        function shareToTelegram() {
            const userName = document.getElementById('userName').innerText;
            let reportText = `📋 *របាយការណ៍វិក័យបត្រទំនិញ*\n`;
            reportText += `👤 អ្នកលក់៖ ${userName}\n`;
            reportText += `📅 កាលបរិច្ឆេទ៖ ${new Date().toLocaleDateString()}\n`;
            reportText += `-----------------------------------\n`;

            items.forEach((item, index) => {
                reportText += `${index + 1}. *${item.name || 'គ្មានឈ្មោះ'}*\n`;
                reportText += `   - តម្លៃពេញ៖ ${parseFloat(item.fullPrice || 0).toFixed(2)} $\n`;
                reportText += `   - ចំនួន៖ ${item.quantity || 0}\n`;
            });
            reportText += `-----------------------------------\n`;
            reportText += `✨ ផ្ញើចេញពី Telegram Mini App`;

            // Try using Telegram WebApp openTelegramLink if available, else copy to clipboard
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                const encodedText = encodeURIComponent(reportText);
                const telegramShareUrl = `https://t.me/share/url?url=&text=${encodedText}`;
                if (tg.openTelegramLink) {
                    tg.openTelegramLink(telegramShareUrl);
                } else {
                    copyToClipboard(reportText);
                }
            } else {
                copyToClipboard(reportText);
            }
        }

        // Clipboard Copy Helper
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showNotification('បានចម្លងរបាយការណ៍រួចរាល់! អាចយកទៅ Paste ក្នុង Telegram បាន។');
            } catch (err) {
                showNotification('មានបញ្ហាក្នុងការចម្លង!');
            }
            document.body.removeChild(textarea);
        }

        // Custom Notification box (No alert used)
        function showNotification(message) {
            const notif = document.createElement('div');
            notif.className = "fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900 border border-amber-500/50 text-amber-300 px-5 py-3 rounded-2xl shadow-2xl z-50 flex items-center space-x-3 text-sm animate-bounce";
            notif.innerHTML = `<i class="fa-solid fa-circle-check text-amber-400 text-lg"></i><span>${message}</span>`;
            document.body.appendChild(notif);
            setTimeout(() => {
                notif.remove();
            }, 3000);
        }
    </script>
</body>
</html>
